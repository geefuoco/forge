name: Relay HTTPS deployment
on:
  pull_request:
    paths: ['tools/player-relay/**', '.github/workflows/relay-deployment.yml']
  workflow_dispatch:
jobs:
  https:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python3 -B -m unittest discover -s tools/player-relay/tests -v
      - run: python3 -B tools/player-relay/deploy/smoke.py --output /tmp/relay-https.json
      - uses: actions/upload-artifact@v4
        with:
          name: relay-https-verification
          path: /tmp/relay-https.json
