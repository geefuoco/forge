services:
  relay:
    build: ..
    command: [--origin, 'https://${RELAY_DOMAIN:?Set RELAY_DOMAIN}', --trusted-proxy-peer, '172.30.92.2']
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 256m
    cpus: 0.5
    pids_limit: 64
    networks:
      backend:
        ipv4_address: 172.30.92.3
    restart: unless-stopped
  caddy:
    image: caddy:2.10.2-alpine@sha256:4c6e91c6ed0e2fa03efd5b44747b625fec79bc9cd06ac5235a779726618e530d
    environment:
      RELAY_DOMAIN: ${RELAY_DOMAIN:?Set RELAY_DOMAIN}
      NO_PROXY: relay,172.30.92.3,localhost,127.0.0.1
      no_proxy: relay,172.30.92.3,localhost,127.0.0.1
    ports: ['80:80', '443:443']
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: [no-new-privileges:true]
    mem_limit: 256m
    cpus: 0.5
    pids_limit: 64
    networks:
      public: {}
      backend:
        ipv4_address: 172.30.92.2
    restart: unless-stopped
networks:
  public: {}
  backend:
    internal: true
    ipam:
      config:
        - subnet: 172.30.92.0/29
volumes:
  caddy_data: {}
  caddy_config: {}
