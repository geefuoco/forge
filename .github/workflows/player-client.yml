name: Installed player client

on:
  workflow_dispatch:
    inputs:
      relay_origin:
        description: Optional HTTPS relay origin
        required: false
        default: ''
  pull_request:
    paths:
      - 'tools/player-client/**'
      - 'tools/browser-bridge/**'
      - 'web/neoforge/**'
      - '.github/workflows/player-client.yml'

permissions:
  contents: read

jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-java@7a445ee88d4e23b52c33a994e0b8b2e33a216d03
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Test packager
        run: python -m unittest discover -s tools/player-client/tests -v
      - name: Compile Forge and resolve exact runtime dependencies
        shell: bash
        run: |
          mvn -B -pl forge-gui-desktop -am -DskipTests -Dcheckstyle.skip compile org.apache.maven.plugins:maven-dependency-plugin:3.1.2:build-classpath -DincludeScope=runtime -Dmdep.outputFile="$RUNNER_TEMP/player-runtime-classpath.txt"
      - name: Generate catalogue provenance
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/catalog/tools"
          cp web/neoforge/tools/generate-catalog.py "$RUNNER_TEMP/catalog/tools/generate-catalog.py"
          python "$RUNNER_TEMP/catalog/tools/generate-catalog.py" --forge-root .
      - name: Build native application and archive
        env:
          RELAY_ORIGIN: ${{ inputs.relay_origin }}
        shell: bash
        run: |
          python tools/player-client/package.py --classpath-file "$RUNNER_TEMP/player-runtime-classpath.txt" --output "$RUNNER_TEMP/player-client" --relay-origin "$RELAY_ORIGIN" --catalog-dir "$RUNNER_TEMP/catalog/dist/data"
      - name: Smoke native launcher without build tools on PATH
        shell: python
        run: |
          import http.cookiejar, os, pathlib, subprocess, tempfile, time, urllib.request
          image = pathlib.Path(os.environ['RUNNER_TEMP']) / 'player-client' / 'NeoForge'
          binary = image / ('NeoForge.exe' if os.name == 'nt' else 'bin/NeoForge')
          with tempfile.TemporaryDirectory() as directory:
              log = pathlib.Path(directory) / 'launcher.log'
              env = dict(os.environ)
              env['PATH'] = os.environ.get('SystemRoot', '') + '\\System32' if os.name == 'nt' else '/nonexistent'
              with log.open('w') as output:
                  process = subprocess.Popen([str(binary), '--no-open', '--profile', directory], cwd=directory, env=env, stdout=output, stderr=subprocess.STDOUT)
                  try:
                      origin = None
                      for attempt in range(120):
                          text = log.read_text(errors='replace')
                          for line in text.splitlines():
                              if line.startswith('NeoForge client listening at '):
                                  origin = line.split(' at ', 1)[1].strip()
                          if origin:
                              break
                          if process.poll() is not None:
                              raise RuntimeError(text)
                          time.sleep(0.5)
                      assert origin, log.read_text(errors='replace')
                      browser = urllib.request.build_opener(urllib.request.HTTPCookieProcessor(http.cookiejar.CookieJar()))
                      assert browser.open(origin + '/').status == 200
                      assert browser.open(origin + '/api/v1/session').status == 200
                  finally:
                      process.terminate()
                      process.wait(timeout=20)
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: NeoForge-${{ runner.os }}
          path: |
            ${{ runner.temp }}/player-client/*.zip
            ${{ runner.temp }}/player-client/*.tar.gz
          if-no-files-found: error
